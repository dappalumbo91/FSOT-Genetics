name: FSOT-Genetics CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  cross-verify:
    name: Cross-verification (D1D38A + formula path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy mpmath

      - name: Cross-verification gate (Python; lake optional)
        run: python scripts/verify_cross.py

      - name: Authority pin file present
        run: |
          test -f vendor/fsot_compute.py
          test -f vendor/fsot_compute_AUTHORITY_PIN.json
          test -f formulas/FSOT_PROTEIN_DERIVATIONS.md
          test -f lakefile.lean
          test -f FSOTGenetics/ChemLink.lean

  lean-mathlib:
    name: Lean + Mathlib (chem-link + residual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan / Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: lake update (Mathlib)
        run: lake update
        timeout-minutes: 120

      - name: lake build (typecheck Mathlib gates)
        run: lake build
        timeout-minutes: 180
        # Note: no lean_exe on Windows-scale Mathlib (PE export limit); library build is the gate.

  rust-formula-crates:
    name: Rust formula crates (optional build)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo check workspace
        run: cargo check --workspace
        working-directory: .
